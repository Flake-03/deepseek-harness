# DocMind layers over sdk-minimal. Rows below follow sdk-minimal's order.
# Unmentioned rows are requested runtime plugins or their required services.

- id: sdk-app-startup
  config:
    profile: docmind

- id: deepseek-llm-api-extensions
  disabled: true

- id: session-log-deepseek
  disabled: true

- id: plugin-package-inventory-deepseek
  disabled: true

- id: llm-deepseek
  disabled: true

- id: sandbox
  disabled: true

- id: terminal-pwsh
  disabled: true

- id: timer
  disabled: true

- id: session-title
  disabled: true

- id: system-prompt
  config:
    includeHarnessIdentity: false
    includeRuntimeContext: false
    personaPrefix: !!js process.env.DSH_SYSTEM_PROMPT ?? 'You are DocMind, a helpful project documentation assistant.'

- id: mcp-resources
  disabled: true

- id: llm-retry
  disabled: true

- id: jobs
  disabled: true

- id: persistent-pwsh
  disabled: true

- id: sessions
  disabled: true

- insert:
    - id: llm-pi-ai
      name: '@deepseek-ai/dsh-llm-pi-ai'
      config:
        providers:
          google:
            apiKeyEnv: GEMINI_API_KEY

    - id: mcp-docmind
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: docmind
        transport: streamable-http
        url: !!js process.env.MCP_URL
        failOnStartupError: true
